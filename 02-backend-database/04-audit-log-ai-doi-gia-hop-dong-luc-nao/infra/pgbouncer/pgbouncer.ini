;; PgBouncer cho lab 02/04: chỉ dùng để kiểm tra người thực hiện (app.user_id) không rò giữa các client
;; khi kết nối thật được dùng chung theo từng transaction. Tham số: https://www.pgbouncer.org/config.html

[databases]
insurance = host=postgres port=5432 dbname=insurance
; Đúng 1 kết nối thật: mọi client dùng chung một phiên PostgreSQL, nên thấy chắc chắn trạng thái phiên có rò hay không.
insurance_one = host=postgres port=5432 dbname=insurance pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Kết nối thật chỉ gán cho client trong thời gian MỘT transaction: biến đặt bằng SET (mức phiên) ở lại trên
; kết nối thật và sang tay client khác; biến đặt bằng set_config(..., true) hết hạn ở COMMIT/ROLLBACK.
pool_mode = transaction
default_pool_size = 5
max_client_conn = 200
query_wait_timeout = 10

log_connections = 0
log_disconnections = 0
