;; PgBouncer cho lab 02/03. Hai instance (pgbouncer-a, pgbouncer-b) dùng chung file này.
;; Tham số: https://www.pgbouncer.org/config.html

[databases]
; Database dùng cho API. Kết nối thật tới PostgreSQL đi bằng user wallet_app (lấy mật khẩu từ userlist.txt).
wallet = host=postgres port=5432 dbname=wallet
; Chỉ dùng cho test: đúng 1 kết nối thật, để thấy chắc chắn trạng thái phiên "rò" sang client khác
; và hàng đợi khi pooler hết kết nối thật.
wallet_one = host=postgres port=5432 dbname=wallet pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Console quản trị (SHOW POOLS, SHOW STATS, KILL, RESUME): psql -p 56432 -U pgbouncer_admin pgbouncer
admin_users = pgbouncer_admin

; [PATTERN] Kết nối thật chỉ gán cho client trong thời gian MỘT transaction rồi trả về nhóm,
; nên vài chục kết nối thật phục vụ được hàng trăm kết nối client (pod).
pool_mode = transaction

; [PATTERN] Ngân sách kết nối: 2 instance × 10 = 20 kết nối thật cho database "wallet", không phụ thuộc số pod.
; Gần với điểm xuất phát của PostgreSQL wiki: 2 × số lõi + số đĩa = 2 × 8 + 1 = 17 (Docker 8 CPU).
default_pool_size = 10
reserve_pool_size = 0

; Kết nối client rẻ: mỗi pod giữ tối đa 10, 40 pod chia đều cho 2 instance = 200 mỗi instance.
max_client_conn = 1000

; Client chờ kết nối thật quá 5 giây thì nhận lỗi "query_wait_timeout" thay vì treo 120 giây (mặc định).
; Timeout lấy kết nối của pool phía app KHÔNG bao được khoảng chờ này (xem test fail-fast-timeouts).
query_wait_timeout = 5

; Ghi rõ giá trị (mặc định của 1.26 cũng là 200): PgBouncer tự quản prepared statement có tên
; ở mức giao thức trong chế độ transaction. Đặt 0 là quay về hành vi cũ (xem test named-prepared-statements).
max_prepared_statements = 200

log_connections = 0
log_disconnections = 0
