# Chu kỳ 5 s (scrape và đánh giá rule) để game day ngắn; production thường 15–60 s.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Metric của 3 service đi qua Collector. honor_labels giữ label `job` do Collector đặt (= service.name).
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  # USE của chính PostgreSQL (kết nối, khóa, giao dịch) — không đi qua Toxiproxy, đo đúng phía server DB.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
