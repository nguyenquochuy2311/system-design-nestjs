# Lab Password Hashing Argon2id:
# - postgres: PostgreSQL 16 lưu user (password_md5 cũ, password_hash Argon2id, hash_version).
# - redis: Redis 7 giữ bộ đếm đăng nhập sai với TTL (cấu hình tường minh, nhật ký 03/01 điểm 1).
# Cổng host theo bảng cổng của lab: 55432 (PostgreSQL), 56379 (Redis). API (3100) chạy trên host.
name: lab-19-01

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: accounts
    ports:
      - "55432:5432"
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./db:/lab/db:ro
    healthcheck:
      # Hỏi qua TCP: lúc chạy init, server tạm chỉ nghe Unix socket (nhật ký 02/04 điểm 1).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d accounts"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    # Bộ đếm sai mất đi khi restart chỉ làm reset số lần thử — chấp nhận được, nên không lưu xuống đĩa.
    image: redis:7.4.6
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
