# Lab 07/07. `docker compose up -d --wait` chỉ dựng PostgreSQL có PGMQ, đủ cho `pnpm test` (service chạy trong tiến trình test).
# Để đo: profile `truoc` hoặc `sau`, k6 ở profile `bench`, cùng mạng Compose. Service là file JS đã gói bằng esbuild.
# Mật khẩu role chỉ dùng cho lab, cổng chỉ mở trên 127.0.0.1.
name: lab-07-07

x-node-service: &node-service
  image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
  working_dir: /app
  volumes:
    - ./dist:/app:ro
  labels:
    lab.id: "07-07"
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: ghcr.io/pgmq/pg16-pgmq:v1.13.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:55432:5432"
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    labels:
      lab.id: "07-07"
    healthcheck:
      # Hỏi qua TCP: lúc chạy init script, server tạm chỉ nghe Unix socket (nhật ký 02/04 điểm 1).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lab"]
      interval: 1s
      timeout: 3s
      retries: 60

  gateway:
    <<: *node-service
    profiles: ["truoc", "sau"]
    command: ["node", "fake-gateway.cjs"]
    depends_on: {}
    environment:
      DECLINE_RATE: "0.05"
      TIMEOUT_RATE: "0.02"
    ports:
      - "127.0.0.1:3102:3000"

  truoc-inventory:
    <<: *node-service
    profiles: ["truoc"]
    command: ["node", "truoc.cjs"]
    environment:
      SERVICE_NAME: truoc-inventory
      DATABASE_URL: postgres://truoc_rw:truoc_rw@postgres:5432/lab

  truoc-payment:
    <<: *node-service
    profiles: ["truoc"]
    command: ["node", "truoc.cjs"]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      SERVICE_NAME: truoc-payment
      GATEWAY_URL: http://gateway:3000
      GATEWAY_TIMEOUT_MS: "1000"

  truoc-order:
    <<: *node-service
    profiles: ["truoc"]
    command: ["node", "truoc.cjs"]
    depends_on:
      truoc-inventory:
        condition: service_healthy
      truoc-payment:
        condition: service_healthy
    environment:
      SERVICE_NAME: truoc-order
      DATABASE_URL: postgres://truoc_rw:truoc_rw@postgres:5432/lab
      INVENTORY_URL: http://truoc-inventory:3000
      PAYMENT_URL: http://truoc-payment:3000

  inventory-service:
    <<: *node-service
    profiles: ["sau"]
    command: ["node", "inventory-service.cjs"]
    environment:
      DATABASE_URL: postgres://inventory_rw:inventory_rw@postgres:5432/lab

  payment-service:
    <<: *node-service
    profiles: ["sau"]
    command: ["node", "payment-service.cjs"]
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://payment_rw:payment_rw@postgres:5432/lab
      GATEWAY_URL: http://gateway:3000
      GATEWAY_TIMEOUT_MS: "1000"

  order-service:
    <<: *node-service
    profiles: ["sau"]
    command: ["node", "order-service.cjs"]
    environment:
      DATABASE_URL: postgres://order_rw:order_rw@postgres:5432/lab
      SAGA_DEADLINE_SECONDS: "900"

  k6:
    image: grafana/k6:1.4.2@sha256:3656673de3f30424e8ebcfa46acd9558d83b6a43612d0f668ffeac953950c6c7
    profiles: ["bench"]
    volumes:
      - ./bench:/bench:ro
      - ./bench/results:/results
    labels:
      lab.id: "07-07"

volumes:
  pgdata:
    labels:
      lab.id: "07-07"
