# CDN mô phỏng bằng Nginx proxy_cache. Cố ý KHÔNG có proxy_cache_valid hay proxy_ignore_headers: Nginx chỉ lưu theo
# Cache-Control / Expires của máy gốc (s-maxage ưu tiên hơn max-age; private, no-cache, no-store hoặc Set-Cookie thì
# không lưu), nên mọi khác biệt giữa bản trước và bản sau nằm ở header của máy gốc, đúng ràng buộc "chạy với mọi CDN chuẩn".
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Mỗi request một dòng JSON: trạng thái cache ($upstream_cache_status), mã trả về, máy gốc có được gọi không
  # ($upstream_status rỗng = CDN tự trả), If-None-Match của client, header X-Visit do k6 gắn (first/repeat) và thời gian
  # nối tới máy gốc ($upstream_connect_time: 0.000 = dùng lại kết nối keepalive, > 0 = mở kết nối mới).
  log_format cdn escape=json '{"ts":$msec,"m":"$request_method","u":"$request_uri","s":$status,'
                             '"cache":"$upstream_cache_status","us":"$upstream_status","bytes":$bytes_sent,'
                             '"inm":"$http_if_none_match","visit":"$http_x_visit","rt":$request_time,'
                             '"uct":"$upstream_connect_time"}';

  # Bộ nhớ cache nằm trên tmpfs (docker-compose.yml): khởi động lại container là cache trống.
  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:32m max_size=900m inactive=7d use_temp_path=off;

  # Máy gốc chạy trên host: API + media-service (NestJS) ở 3100, trang (Next.js) ở 3200.
  upstream api {
    server host.docker.internal:3100;
    keepalive 64;
  }
  upstream web {
    server host.docker.internal:3200;
    keepalive 64;
  }

  server {
    listen 80;
    access_log /var/log/cdn/access.log cdn buffer=64k flush=1s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;

    proxy_cache cdn;
    # Bản lưu hết hạn thì hỏi lại máy gốc bằng If-None-Match (ETag của bản lưu); 304 -> REVALIDATED, không tải lại body.
    proxy_cache_revalidate on;
    add_header X-Cache-Status $upstream_cache_status always;

    location = /__cdn/health {
      access_log off;
      return 200 "ok\n";
    }
    location /api/ {
      proxy_pass http://api;
    }
    location /media/ {
      proxy_pass http://api;
    }
    location / {
      proxy_pass http://web;
    }
  }
}
