# CDN mô phỏng bằng Nginx proxy_cache (cùng cách dựng với bài 04/01): không có proxy_cache_valid hay
# proxy_ignore_headers, nên chỉ header của máy gốc quyết định lưu gì, lưu bao lâu. Bộ nhớ cache nằm trên tmpfs.
worker_processes 4;

events {
  worker_connections 4096;
}

http {
  # Mỗi request một dòng JSON: trạng thái cache, máy gốc có được gọi không ($upstream_status rỗng = CDN tự trả),
  # header hỏi lại của trình duyệt, cookie uid do script đo đặt cho từng người dùng giả lập.
  log_format cdn escape=json '{"ts":$msec,"host":"$host","m":"$request_method","u":"$request_uri","s":$status,'
                             '"cache":"$upstream_cache_status","us":"$upstream_status","bytes":$bytes_sent,'
                             '"inm":"$http_if_none_match","ims":"$http_if_modified_since","cc":"$http_cache_control",'
                             '"uid":"$cookie_uid","rt":$request_time,"uct":"$upstream_connect_time"}';
  access_log /var/log/lab/cdn.log cdn buffer=32k flush=1s;

  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:16m max_size=400m inactive=7d use_temp_path=off;

  upstream origin {
    server origin:80;
    keepalive 32;
  }
  # API chạy trên host: bản sau ở 3100, bản trước ở 3101.
  upstream api_sau {
    server host.docker.internal:3100;
    keepalive 32;
  }
  upstream api_truoc {
    server host.docker.internal:3101;
    keepalive 32;
  }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_cache_revalidate on;
  proxy_connect_timeout 5s;
  add_header X-Cache-Status $upstream_cache_status always;

  server {
    listen 80;
    server_name sau.localhost;
    # "Xóa cache CDN" của lab: đổi thế hệ khóa cache (tệp do scripts/cdn.ts viết) rồi nginx -s reload.
    set $cache_gen "g0";
    include /etc/nginx/cdn-state/*.conf;
    proxy_cache_key "$cache_gen$scheme://$host$request_uri";

    location /api/ {
      proxy_pass http://api_sau;
    }
    location / {
      proxy_cache cdn;
      proxy_pass http://origin;
    }
  }

  server {
    listen 80;
    server_name truoc.localhost;
    set $cache_gen "g0";
    include /etc/nginx/cdn-state/*.conf;
    proxy_cache_key "$cache_gen$scheme://$host$request_uri";

    location /api/ {
      proxy_pass http://api_truoc;
    }
    location / {
      proxy_cache cdn;
      proxy_pass http://origin;
    }
  }

  server {
    listen 80 default_server;
    location = /__cdn/health {
      access_log off;
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }
}
