# [PATTERN] Header theo nhóm file.
server {
  listen 80;
  server_name sau.localhost;
  root /srv/sau;

  # [PATTERN] File có hash nội dung trong tên: URL này không bao giờ đổi nội dung → lưu một năm, immutable (RFC 8246).
  # Thiếu file thì 404 thật; KHÔNG rơi về index.html (trả HTML cho một import() JS là lỗi khó đọc hơn 404).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # [PATTERN] File vào cửa, URL cố định: lưu được nhưng luôn hỏi lại (ETag của Nginx), nên luôn trỏ đúng bản mới.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /version.json {
    add_header Cache-Control "no-cache";
  }
  location = /widget.js {
    add_header Cache-Control "no-cache";
  }

  # Route của SPA: trả index.html (khối trên, cùng no-cache).
  location / {
    try_files $uri /index.html;
  }
}
