# Hiện trạng: tên file cố định (app.js, vendor.js, reports.js, app.css, widget.js) và MỌI file, kể cả index.html,
# mang max-age 1 ngày. Route của SPA (/, /khach-hang/12, /bao-cao) rơi về index.html.
server {
  listen 80;
  server_name truoc.localhost;
  root /srv/truoc;

  location / {
    add_header Cache-Control "max-age=86400";
    try_files $uri /index.html;
  }
}
