# Máy gốc tĩnh: Nginx đọc thẳng thư mục deploy (.data/www/<site>, bind mount). Hai site cùng một container, chọn
# theo tên miền mà CDN chuyển tới (Host): truoc.localhost (hiện trạng) và sau.localhost (áp dụng pattern).
worker_processes 2;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format origin escape=json '{"ts":$msec,"host":"$host","m":"$request_method","u":"$request_uri","s":$status,"bytes":$bytes_sent}';
  access_log /var/log/lab/origin.log origin buffer=16k flush=1s;
  sendfile on;
  # Nginx tự gửi ETag (mtime + kích thước) và Last-Modified cho file tĩnh; nén gzip thì ETag thành ETag yếu (W/).
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;

  include /etc/nginx/lab/site-truoc.conf;
  include /etc/nginx/lab/site-sau.conf;

  server {
    listen 80 default_server;
    location = /__origin/health {
      access_log off;
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }
}
